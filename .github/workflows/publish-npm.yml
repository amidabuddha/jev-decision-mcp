name: Publish npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.19.1
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const server = JSON.parse(readFileSync('server.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package version');
          assert.equal(server.version, pkg.version, 'MCP Registry version must match package version');
          for (const entry of server.packages) {
            assert.equal(entry.version, pkg.version, 'Registry package version must match package version');
          }
          NODE
      - run: npm ci
      - run: npm run check
      - name: Publish with GitHub identity
        run: npm publish --access public
